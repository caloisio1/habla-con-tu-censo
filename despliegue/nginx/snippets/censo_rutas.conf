# Rutas de la app, compartidas por las plantillas http y https.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Validación de Let's Encrypt por webroot (certbot corre en el host).
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# FastAPI publica por defecto la documentación interactiva de la API. No hace falta
# para usar la app y le describe la superficie a cualquiera: se cierra acá.
location = /docs         { return 404; }
location = /redoc        { return 404; }
location = /openapi.json { return 404; }
location /docs/          { return 404; }

# Respaldos que pudieran quedar dentro de app/static/ (la imagen ya los excluye
# por .dockerignore; esto es la segunda capa).
location ~* \.(bak|orig|swp)|\.bak[_.-] { return 404; }

location = /preguntar {
    limit_except POST { deny all; }
    include snippets/censo_tope.conf;
    include snippets/censo_proxy.conf;
}
location = /preguntar_stream {
    limit_except POST { deny all; }
    include snippets/censo_tope.conf;
    include snippets/censo_proxy.conf;
}

location / {
    limit_except GET { deny all; }
    include snippets/censo_proxy.conf;
}
