# Tope de frecuencia, SOLO para /preguntar y /preguntar_stream.
#
# No va en location /: ahí contaría también los estáticos, y una clase de 30 alumnos
# abriendo la página a la vez agota la ráfaga antes de preguntar nada. Lo caro es
# preguntar, no leer la página.
#
# 30 por minuto por IP, ráfaga de 15 sin demora, 8 conexiones simultáneas.
limit_req zone=censo_req burst=15 nodelay;
limit_conn censo_conn 8;
# Una pregunta es un JSON de pocos cientos de bytes. La app no limita el largo del
# texto; este es el único tope.
client_max_body_size 16k;
