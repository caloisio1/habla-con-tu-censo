# Proxy hacia la app (servicio "app" del compose, puerto 8010, solo en la red interna).
proxy_pass http://app:8010;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Una pregunta son DOS llamadas al modelo, acotadas a 60 s cada una (comun/llm.py).
# nginx va ÚLTIMO en la cadena (backend ~93 s < frontend 150 s < nginx 180 s): el que
# corta debe ser el frontend, que sabe explicar por qué.
proxy_read_timeout 180s;
proxy_send_timeout 180s;
# /preguntar_stream es SSE: la app manda X-Accel-Buffering: no, que nginx respeta.
