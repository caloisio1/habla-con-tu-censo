# Contexto http (el nginx.conf de la imagen incluye conf.d/*.conf dentro de http {}).
#
# Zonas del límite de frecuencia. Solo DECLARAN la memoria compartida; el límite se
# aplica en snippets/censo_tope.conf, únicamente en los dos endpoints que llaman al
# modelo. Por qué: cada consulta retiene un hilo de la app hasta dos minutos (dos
# llamadas al modelo); menos de una petición por segundo sostenida la satura.
limit_req_zone $binary_remote_addr zone=censo_req:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=censo_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;

# Los GeoJSON de segmentos pesan varios MB; comprimidos viajan a una fracción.
# La app (StaticFiles) sirve los .geojson como application/octet-stream porque el
# módulo mimetypes de Python no conoce la extensión: sin ese tipo en la lista, los
# mapas viajan sin comprimir. El único otro octet-stream son las 4 fuentes woff2,
# que ya vienen comprimidas y pesan ~100 KB: recomprimirlas no cuesta nada visible.
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/json application/geo+json application/octet-stream text/css application/javascript text/plain;
